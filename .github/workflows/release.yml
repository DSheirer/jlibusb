# Publishes a release when a version tag is pushed, built from the libusb
# version pinned in native/versions.env. The tag has to match that pin: v1.0.30,
# v1.0.30.1 for a Java-only fix, or v1.0.30-rc1 for a pre-release.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          source native/versions.env
          case "$GITHUB_REF_NAME" in
            "v$LIBUSB_VERSION" | "v$LIBUSB_VERSION".[0-9]* | "v$LIBUSB_VERSION"-*) ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME does not match pinned libusb version $LIBUSB_VERSION"
              exit 1
              ;;
          esac
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd jars && sha256sum *.jar > SHA256SUMS)
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" jars/* "${prerelease[@]}" \
            --verify-tag --generate-notes --title "jlibusb ${GITHUB_REF_NAME#v}"
